<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký - MindX Smart Class Manager</title>
  <link rel="stylesheet" href="css/style.css">
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <h2 class="auth-title">Đăng ký tài khoản</h2>
      <div id="authErrorMsg" class="auth-error hidden"></div>
      
      <form id="registerForm">
        <div class="form-group">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" class="form-control" required placeholder="Nhập email của bạn">
        </div>
        <div class="form-group">
          <label for="regPassword">Mật khẩu</label>
          <input type="password" id="regPassword" class="form-control" required placeholder="Nhập mật khẩu (từ 6 ký tự)">
        </div>
        <div class="form-group">
          <label for="regConfirmPassword">Xác nhận mật khẩu</label>
          <input type="password" id="regConfirmPassword" class="form-control" required placeholder="Nhập lại mật khẩu">
        </div>
        <button type="submit" class="btn btn-primary btn-block mt-3" id="registerBtn">Đăng ký</button>
      </form>
      
      <div class="auth-links mt-3">
        <p>Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
        <p><a href="index.html">Quay về trang chủ</a></p>
      </div>
    </div>
  </div>

  <!-- Missing config warning -->
  <div id="configWarning" class="state-message error hidden" style="margin: 20px;">
    <p>Thiếu file cấu hình firebase-config.js. Vui lòng làm theo hướng dẫn README.</p>
  </div>

  <script src="js/firebase-config.js" onerror="window.firebaseConfigMissing = true;"></script>
  <script src="js/auth.js"></script>
  <script>
    // B5 LAYER: Bind Auth Form
    document.addEventListener("DOMContentLoaded", () => {
      if (window.firebaseConfigMissing) {
        document.getElementById('configWarning').classList.remove('hidden');
        document.getElementById('registerBtn').disabled = true;
        return;
      }

      const registerForm = document.getElementById('registerForm');
      registerForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;
        const confirmPassword = document.getElementById('regConfirmPassword').value;
        
        if (password !== confirmPassword) {
          document.getElementById('authErrorMsg').innerText = "Mật khẩu xác nhận không khớp.";
          document.getElementById('authErrorMsg').classList.remove('hidden');
          return;
        }

        window.registerUser(email, password, 'authErrorMsg');
      });
    });
  </script>
</body>
</html>
